name: Evidence-first bounty radar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - moneymaker/**
      - config/**
      - tests/**
      - .github/workflows/bounty-radar.yml
  schedule:
    - cron: "17 6,18 * * *"

permissions:
  contents: write

concurrency:
  group: bounty-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Find and verify open bounties
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m moneymaker.radar --config config/sources.json

      - name: Publish refreshed opportunity reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/bounties.json reports/BOUNTIES.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh verified-open bounty radar"
          git push

